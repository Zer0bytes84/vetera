[package]
name = "vetera"
version = "3.3.29"
description = "Système de gestion vétérinaire professionnel"
authors = ["Zouhir Kherroubi"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "vetera_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
sha2 = "0.10.9"
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
getrandom = "0.2"
mdns-sd = "0.21.6"
libsqlite3-sys = { version = "0.30", default-features = false }
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = false
