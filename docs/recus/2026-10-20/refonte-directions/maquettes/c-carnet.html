<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Geist Var"; src: url(assets/geist-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
/* Direction C, Carnet: the animal's health booklet. The screen speaks first,
   in a sentence; warm sage ground, soft cards, the mascot in the empty moments. */
:root {
  --ground: #f3f4ef; --surface: #ffffff; --soft: #f8f9f6; --hover: #f5f5f5;
  --ink: #292929; --ink-2: #5d5d5d; --ink-3: #7f7f7f;
  --edge: #e6e8e0; --line: #f0f1ec;
  --accent: #2f5d4e; --accent-ink: #ffffff; --accent-tint: #e4ede7;
  --primary: #292929; --on-primary: #ffffff;
  --s-planned: #9a9a94; --s-waiting: #c08a2c; --s-consultation: #4a78b8; --s-care: #3a8a7c; --s-billing: #c4553f; --s-done: #4f8a62;
  --t-planned: #f0f0ec; --t-waiting: #f8eedc; --t-consultation: #e7eef8; --t-care: #e2f0ec; --t-billing: #f8e6e1; --t-done: #e6f0e8;
  --good: #3f7a52; --bad: #b4473a;
  --display: "Newsreader", Georgia, serif;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
:root[data-theme="dark"] {
  --ground: #121412; --surface: #1b1e1b; --soft: #171a17; --hover: #232723;
  --ink: #ededea; --ink-2: #b8bab4; --ink-3: #8b8e87;
  --edge: #2a2e29; --line: #232723;
  --accent: #8cc2aa; --accent-ink: #10201a; --accent-tint: #1f2e27;
  --primary: #ededea; --on-primary: #121412;
  --s-planned: #8b8e87; --s-waiting: #e0b569; --s-consultation: #8fb3e6; --s-care: #7cc6b6; --s-billing: #ec9a88; --s-done: #8cc49c;
  --t-planned: #232723; --t-waiting: #3a301c; --t-consultation: #1e2a3b; --t-care: #1a302b; --t-billing: #3a231e; --t-done: #1d2f22;
  --good: #8cc49c; --bad: #ec9a88;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--ground); }
body { font: 400 13px/1.5 "Geist Var", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.i { flex: none; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

.sb { padding: 16px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
.sb-mascot { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); }
.sb-name { font: 500 22px/1 var(--display); letter-spacing: -.01em; flex: 1; }
.sb-fold { color: var(--ink-3); display: grid; }
.sb-group { font-size: 12px; color: var(--ink-3); padding: 14px 10px 4px; }
.nav-item, .nav-quick { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); transition: background-color 120ms ease; }
.nav-item:hover, .nav-quick:hover { background: var(--edge); color: var(--ink); }
.nav-item.is-active { background: var(--surface); color: var(--ink); font-weight: 500; }
.nav-item.is-active .i { color: var(--accent); }
.sb-nav { flex: 1; }
.sb-user { display: flex; gap: 10px; align-items: center; padding: 10px; background: var(--surface); border-radius: 14px; }
.sb-user img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.sb-user b { display: block; font-weight: 500; }
.sb-user small { color: var(--ink-3); font-size: 12px; }

.main { min-width: 0; }
.top { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; color: var(--ink-3); }
.top .crumb b { color: var(--ink); font-weight: 500; }
.top .tools { display: flex; gap: 2px; }
.top .tools button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); }
.top .tools button:hover { background: var(--edge); }
.page { padding: 8px 36px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; max-width: 1224px; }
.load-banner { margin: 0 36px 8px; padding: 8px 14px; font-size: 12px; color: var(--ink-2); background: var(--surface); border-radius: 10px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 99px; font-weight: 500; transition: transform 120ms var(--ease), background-color 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: var(--surface); box-shadow: 0 0 0 1px var(--edge); }
.btn-quiet:hover { background: var(--soft); }
.btn-lg { height: 42px; padding: 0 20px; font-size: 14px; }
.btn-lg .i { transition: transform 160ms var(--ease); }
.btn-lg:hover .i { transform: translateX(3px); }
.kbd { font-size: 12px; opacity: .55; }

.card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--edge); min-width: 0; }
.ch { display: flex; align-items: baseline; gap: 10px; padding: 18px 22px 12px; }
.ch h2 { font: 500 20px/1.2 var(--display); letter-spacing: -.01em; }
.ch .meta { color: var(--ink-3); font-size: 12px; }
.ch .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.more { color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; }
.more:hover { color: var(--accent); }

/* Header: the greeting, then the day said in one sentence. */
.head { grid-column: span 12; display: flex; align-items: center; gap: 20px; padding: 6px 0 8px; }
.head img { width: 72px; height: 72px; border-radius: 22px; background: var(--surface); }
.head h1 { font: 500 32px/1.15 var(--display); letter-spacing: -.02em; }
.head p { font-size: 16px; color: var(--ink-2); margin-top: 4px; max-width: 720px; }
.head p b { color: var(--ink); font-weight: 500; }
.head .actions { margin-left: auto; display: flex; gap: 8px; align-self: flex-end; }

/* Maintenant: three tickets, then the day's string of beads, one per visit. */
.tickets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px 22px 0; }
.ticket { background: var(--t); border-radius: 12px; padding: 14px 16px; min-height: 132px; }
.ticket .tl { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; }
.ticket .tl b { font: 500 24px/1 var(--display); color: var(--ink); }
.ticket ul { list-style: none; padding: 0; margin-top: 10px; display: grid; gap: 4px; }
.ticket li { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; min-width: 0; }
.ticket li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket li span:last-child { color: var(--ink-2); font-weight: 400; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ticket .none { color: var(--ink-3); margin-top: 10px; }
.ticket.is-zero { background: var(--soft); }
.beads { display: flex; align-items: center; gap: 18px; padding: 18px 22px 20px; }
.beads .row { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.bead { width: 14px; height: 14px; border-radius: 50%; background: var(--c); transition: transform 140ms var(--ease); }
.bead.is-planned { background: transparent; box-shadow: inset 0 0 0 1.5px var(--s-planned); }
.bead:hover { transform: scale(1.25); }
.beads .txt { color: var(--ink-2); white-space: nowrap; }
.beads .txt b { color: var(--ink); font-weight: 500; }

.next-card { padding: 18px 22px; }
.next-card .lbl { color: var(--ink-3); font-size: 12px; }
.next-card .big { font: 500 32px/1.1 var(--display); letter-spacing: -.02em; margin-top: 4px; }
.next-card .who { margin-top: 2px; color: var(--ink-2); font-size: 14px; }
.next-card .who b { color: var(--ink); font-weight: 500; }
.next-card + .next-card { border-top: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; }
.stack .card { flex: 1; display: flex; flex-direction: column; }

.plan { list-style: none; padding: 0 10px 10px; }
.plan li { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 12px; transition: background-color 100ms ease; }
.plan li:hover { background: var(--soft); }
.plan .t { font: 500 18px/1 var(--display); font-variant-numeric: tabular-nums; }
.plan b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .why b { font-weight: 400; color: var(--ink-2); }
.plan li.is-done .t, .plan li.is-done .who b { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; background: var(--t); font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.plan-more { display: block; margin: 0 22px 16px; color: var(--ink-2); }
.daynav { display: flex; gap: 2px; align-items: center; }
.daynav button { height: 30px; min-width: 30px; display: grid; place-items: center; border-radius: 99px; color: var(--ink-2); padding: 0 8px; }
.daynav button:hover { background: var(--soft); }

.chips { display: flex; gap: 6px; padding: 0 22px 10px; flex-wrap: wrap; }
.chips button { height: 28px; padding: 0 12px; border-radius: 99px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--edge); font-size: 12px; }
.chips button.on { background: var(--accent-tint); color: var(--accent); box-shadow: none; font-weight: 500; }
.todo { list-style: none; padding: 0 10px 10px; }
.todo li { display: flex; gap: 12px; padding: 10px 12px; border-radius: 12px; }
.todo li:hover { background: var(--soft); }
.box { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--edge); flex: none; transition: box-shadow 120ms ease, transform 120ms var(--ease); }
.box:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.box:active { transform: scale(.9); }
.todo small { display: block; color: var(--ink-3); font-size: 12px; }
.todo small.late { color: var(--bad); font-weight: 500; }
.empty { display: flex; align-items: center; gap: 14px; padding: 10px 22px 22px; color: var(--ink-2); }
.empty img { width: 52px; height: 52px; }
.empty b { display: block; color: var(--ink); font: 500 16px/1.3 var(--display); }
.quiet { padding: 4px 22px 22px; color: var(--ink-3); }

.wl { list-style: none; padding: 0 10px 12px; }
.wl li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; }
.wl li:hover { background: var(--soft); }
.wl .l { min-width: 0; }
.wl b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wl small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wl .r { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.wl .r.late { color: var(--bad); font-weight: 500; }

.sect { grid-column: span 12; display: flex; align-items: baseline; gap: 12px; margin-top: 16px; }
.sect h2 { font: 500 24px/1.2 var(--display); letter-spacing: -.015em; }
.sect .meta { color: var(--ink-3); }
.seg { margin-left: auto; display: flex; gap: 2px; background: var(--surface); padding: 3px; border-radius: 99px; box-shadow: 0 0 0 1px var(--edge); }
.seg button { height: 28px; padding: 0 12px; border-radius: 99px; color: var(--ink-2); }
.seg button.on { background: var(--accent-tint); color: var(--accent); font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { text-align: left; padding: 20px 22px; border-left: 1px solid var(--line); transition: background-color 120ms ease; }
.kpi:first-child { border-left: 0; border-radius: 16px 0 0 16px; } .kpi:last-child { border-radius: 0 16px 16px 0; }
.kpi:hover { background: var(--soft); }
.kpi-l { color: var(--ink-2); }
.kpi-v { display: block; font: 500 34px/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0; font-variant-numeric: tabular-nums lining-nums; }
.kpi-v small { font: 400 14px "Geist Var"; color: var(--ink-3); margin-left: 4px; }
.kpi-d, .kpi-x { display: block; font-size: 12px; color: var(--ink-3); }
.delta { font-weight: 500; }
.delta.is-good { color: var(--good); } .delta.is-bad { color: var(--bad); } .delta.is-none, .delta.is-flat { color: var(--ink-3); font-weight: 400; }
.chart-body { padding: 0 22px 14px; }
.ch-grid { stroke: var(--line); } .ch-grid.is-base { stroke: var(--edge); }
.ch-y, .ch-x { fill: var(--ink-3); font-size: 12px; font-family: "Geist Var"; font-variant-numeric: tabular-nums; }
.ch-x.is-today { fill: var(--accent); font-weight: 600; }
.ch-bar { fill: var(--accent-tint); } .ch-bar.is-today, .ch-bar:hover { fill: var(--accent); }
.ch-dot { fill: var(--ink-3); opacity: .5; } .ch-dot.is-today { fill: var(--accent); opacity: 1; } .ch-dot-empty { fill: var(--edge); }
.ch-empty { fill: var(--ink-3); font-size: 13px; }
.facts { padding: 0 22px 8px; }
.fact { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
.fact dt { color: var(--ink-2); }
.fact dd { font: 500 20px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.fact dd small { font: 400 12px "Geist Var"; color: var(--ink-3); margin-left: 3px; }
.fact dd.muted { color: var(--ink-3); font: 400 13px "Geist Var"; }
.fact dd.warn { color: var(--bad); }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 10px 12px; }
.mod { display: flex; gap: 12px; padding: 12px; border-radius: 12px; transition: background-color 120ms ease; }
.mod:hover { background: var(--soft); }
.mod .i { color: var(--accent); margin-top: 2px; }
.mod b { font-weight: 500; display: block; }
.mod span { color: var(--ink-3); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="real-data.js"></script>
<script src="model.js"></script>
<script src="shell.js"></script>
<script src="parts.js"></script>
<script>
const M = BaitariModel, S = Shell, X = Parts, I = S.icon;
const m = M.load(S.state);
const sv = (s) => `--c: var(--s-${s}); --t: var(--t-${s})`;

function ticket(stage, title, list, right, empty) {
  const items = list.slice(0, 3).map((v) => `<li><span>${X.esc(v.patient)}</span><span>${right(v)}</span></li>`).join("");
  const more = list.length > 3 ? `<li><span style="color:var(--ink-3);font-weight:400">et ${list.length - 3} de plus</span></li>` : "";
  return `<div class="ticket${list.length ? "" : " is-zero"}" style="${sv(stage)}"><div class="tl"><span>${title}</span><b>${list.length}</b></div>${list.length ? `<ul>${items}${more}</ul>` : `<p class="none">${empty}</p>`}</div>`;
}

function now() {
  const order = ["done", "billing", "care", "consultation", "waiting", "planned"];
  const beads = m.today.slice().sort((a, b) => order.indexOf(a.stage) - order.indexOf(b.stage) || a.start - b.start)
    .map((v) => `<i class="bead${v.stage === "planned" ? " is-planned" : ""}" style="${sv(v.stage)}" title="${v.time} ${X.esc(v.patient)}, ${M.STAGE_LABEL[v.stage]}"></i>`).join("");
  const care = [...m.byStage.consultation, ...m.byStage.care];
  return `<section class="card span-8">
    <div class="ch"><h2>Maintenant</h2><span class="meta">À ${m.nowLabel}, d’après Flux</span></div>
    <div class="tickets">
      ${ticket("waiting", "En salle d’attente", m.byStage.waiting, (v) => `${m.waitingMinutes(v)} min`, "Personne n’attend.")}
      ${ticket("consultation", "En consultation ou en soins", care, (v) => (v.stage === "care" ? "soins" : "consultation"), "Aucune visite en cours.")}
      ${ticket("billing", "À facturer", m.byStage.billing, (v) => v.time, "Rien à facturer.")}
    </div>
    <div class="beads">${m.today.length ? `<div class="row" aria-label="Une perle par visite du jour">${beads}</div><span class="txt"><b>${m.progress.done}</b> sur ${m.progress.total} terminées</span>` : `<span class="txt" style="flex:1">Aucune visite aujourd’hui.</span>`}
      <a class="btn btn-accent btn-lg" href="#">Ouvrir Flux ${I("arrow")}</a></div>
  </section>`;
}

function aside() {
  const n = m.next;
  return `<div class="span-4 stack"><section class="card">
    <div class="next-card"><p class="lbl">Prochain rendez-vous</p>${n ? `<p class="big">${n.time}</p><p class="who"><b>${X.esc(n.patient)}</b>, ${X.esc(n.owner)}</p><p class="who" style="font-size:13px">${X.esc(n.type)} · ${X.esc(n.reason)}</p>` : `<p class="big" style="font-size:20px;margin-top:8px">${m.today.length ? "Plus rien aujourd’hui" : "Aucun rendez-vous"}</p><p class="who" style="font-size:13px">${m.today.length ? "La journée est entièrement passée." : "Les rendez-vous apparaîtront dès leur réservation."}</p>`}</div>
    <div class="next-card"><p class="lbl">Caisse du jour</p><p class="big num">${M.num(m.money.incomeToday / 100)}<span style="font:400 14px 'Geist Var';color:var(--ink-3);margin-left:4px">DA</span></p><p class="who" style="font-size:13px">${m.money.txToday ? X.plural(m.money.txToday, "encaissement", "encaissements") : "Aucun encaissement aujourd’hui"}</p></div>
  </section></div>`;
}

function planning() {
  const rows = m.today.slice(0, 7).map((v) => `<li class="${v.stage === "done" ? "is-done" : ""}"><span class="t">${v.time}</span>
    <span class="who"><b>${X.esc(v.patient)}</b><small>${X.esc(v.species)} · ${X.esc(v.owner)}</small></span>
    <span class="why"><b>${X.esc(v.type)}</b><small>${X.esc(v.reason)}</small></span>
    <span class="pill" style="${sv(v.stage)}"><i></i>${M.STAGE_LABEL[v.stage]}</span></li>`).join("");
  const body = m.today.length ? `<ul class="plan">${rows}</ul>${m.today.length > 7 ? `<a class="plan-more more" href="#">Voir les ${m.today.length} visites dans l’Agenda ${I("arrow", 14)}</a>` : ""}`
    : `<div class="empty"><img src="assets/chien-base.webp" alt=""><span><b>Une journée encore blanche</b>Les rendez-vous pris dans l’Agenda s’inscrivent ici.</span><button class="btn btn-quiet" style="margin-left:auto">${I("plus")}Planifier une visite</button></div>`;
  return `<section class="card span-8"><div class="ch"><h2>Planning des visites</h2><span class="meta">${m.today.length ? X.plural(m.today.length, "visite", "visites") : ""}</span><span class="end"><div class="daynav"><button>${I("left", 14)}</button><button>Aujourd’hui</button><button>${I("right", 14)}</button></div></span></div>${body}</section>`;
}

function todo() {
  const t = m.openTasks;
  return `<section class="card span-4"><div class="ch"><h2>À faire</h2><span class="end"><a class="more" href="#">Rappels ${I("arrow", 14)}</a></span></div>
    <div class="chips"><button class="on">Tout ${m.kpis.actions}</button><button>Tâches ${t.length}</button><button>Vaccins ${m.reminders.length}</button><button>Stock ${m.stock.length}</button></div>
    ${t.length ? `<ul class="todo">${t.slice(0, 4).map((x) => `<li><button class="box" aria-label="Terminer"></button><span>${X.esc(x.title)}<small class="${x.overdue ? "late" : ""}">Échéance ${x.due ? X.relDue(x.due, m.now) : "non fixée"}</small></span></li>`).join("")}</ul>` : `<div class="empty"><img src="assets/chat-base.webp" alt=""><span><b>Rien en attente</b>Les tâches et relances arrivent ici.</span></div>`}
  </section>`;
}

function watch(title, link, n, items, empty) {
  return `<section class="card span-4"><div class="ch"><h2 style="font-size:18px">${title}</h2>${n ? `<span class="meta">${n}</span>` : ""}<span class="end"><a class="more" href="#">${link} ${I("arrow", 14)}</a></span></div>${items.length ? `<ul class="wl">${items.join("")}</ul>` : `<p class="quiet">${empty}</p>`}</section>`;
}

function activity() {
  const k = m.kpis, mo = m.money;
  const kpi = (label, value, unit, d, x) => `<button class="kpi"><span class="kpi-l">${label}</span><span class="kpi-v">${value}${unit ? `<small>${unit}</small>` : ""}</span><span class="kpi-d">${d}</span><span class="kpi-x">${x}</span></button>`;
  return `<div class="sect"><h2>Le mois en chiffres</h2><span class="meta">Du ${m.rangeLabel}</span><div class="seg"><button>7 jours</button><button class="on">30 jours</button><button>90 jours</button><button>12 mois</button></div></div>
    <section class="card span-12 kpis">
      ${kpi("Trésorerie", M.num(mo.income30 / 100), "DA", X.delta(mo.change), `Solde net ${M.da(mo.net30)} · dépenses ${M.da(mo.expense30)}`)}
      ${kpi("Consultations", M.num(k.visits30), "", X.delta(k.visitsChange), `${k.done30} terminées · ${k.visits30 - k.done30} en cours`)}
      ${kpi("Patients suivis", M.num(k.seen30), "", X.delta(k.seenChange), X.plural(k.newRecords, "nouveau dossier", "nouveaux dossiers"))}
      ${kpi("Actions à suivre", M.num(k.actions), "", `${X.plural(m.openTasks.length, "tâche", "tâches")} · ${X.plural(m.reminders.length, "vaccin", "vaccins")} · ${m.stock.length} en stock`, "&nbsp;")}
    </section>
    <section class="card span-8"><div class="ch"><h2 style="font-size:18px">Recettes et visites</h2><span class="meta">Encaissé par jour en DA, une pastille par jour de visites</span><span class="end"><a class="more" href="#">Finances ${I("arrow", 14)}</a></span></div><div class="chart-body">${X.chart(m.series, { w: 740, h: 240, radius: 4 })}</div></section>
    <section class="card span-4"><div class="ch"><h2 style="font-size:18px">Cette semaine</h2><span class="end"><a class="more" href="#">Agenda ${I("arrow", 14)}</a></span></div>
      <dl class="facts">
        <div class="fact"><dt>Recettes encaissées</dt><dd>${M.num(m.week.income / 100)}<small>DA</small></dd></div>
        <div class="fact"><dt>Consultations</dt><dd>${M.num(m.week.visits)}</dd></div>
        <div class="fact"><dt>Taux de règlement</dt>${m.week.settleRate === null ? `<dd class="muted">Aucune facture</dd>` : `<dd>${m.week.settleRate.toLocaleString("fr-FR")}<small>%</small></dd>`}</div>
        <div class="fact"><dt>Reste à recouvrer</dt><dd class="${mo.receivables ? "warn" : ""}">${M.num(mo.receivables / 100)}<small>DA</small></dd></div>
      </dl></section>`;
}

function cabinet() {
  const mods = [["calendar", "Agenda & rendez-vous", "Planning et disponibilités"], ["care", "Soins & hospitalisation", "Soins du jour et séjours"], ["paw", "Dossiers patients", "Fiches, antécédents, propriétaires"], ["box", "Produits", "Médicaments, lots, seuils"], ["wallet", "Facturation & devis", "Factures, règlements, devis"], ["bell", "Rappels & vaccins", "Échéances et relances"], ["doc", "Documents", "Ordonnances, comptes rendus"], ["chart", "Bilan & analyses", "Indicateurs et synthèse"]];
  return `<section class="card span-12"><div class="ch"><h2 style="font-size:18px">Gestion du cabinet</h2></div><div class="mods">${mods.map(([ic, a, b]) => `<a class="mod" href="#">${I(ic, 18)}<span><b>${a}</b><span>${b}</span></span></a>`).join("")}</div></section>`;
}

const hello = m.now.getHours() >= 18 ? "Bonsoir" : "Bonjour";
const day = m.dateLabel.charAt(0).toUpperCase() + m.dateLabel.slice(1);
document.getElementById("app").innerHTML = `${S.sidebar()}
<main class="main">
  <div class="top"><span class="crumb">Cabinet / <b>Tableau de bord</b></span><span class="tools"><button>${I("sun")}</button><button>${I("search")}</button><button>${I("chat")}</button><button>${I("bell")}</button><button>${I("sliders")}</button></span></div>
  ${S.loadBanner()}
  <div class="page">
    <header class="head"><img src="assets/chien-base.webp" alt=""><div><h1>${hello}, Zouhir</h1><p>${day}. <b>${m.finding}</b></p></div>
      <div class="actions"><button class="btn btn-quiet">${I("plus")}Nouveau patient</button><button class="btn btn-primary">${I("steth")}Nouvelle consultation <span class="kbd">N</span></button></div></header>
    ${now()}${aside()}
    ${planning()}${todo()}
    ${watch("Hospitalisés", "Soins", m.stays.length, m.stays.map((s) => `<li><span class="l"><b>${X.esc(s.patient)}</b><small>${X.esc(s.reason)}</small></span><span class="r">${X.since(s.since, m.now)}</span></li>`), "Aucun animal hospitalisé.")}
    ${watch("Rappels à venir", "Rappels", m.reminders.length, m.reminders.map((r) => `<li><span class="l"><b>${X.esc(r.patient)}</b><small>${X.esc(r.type)}</small></span><span class="r${r.due < m.now ? " late" : ""}">${X.relDue(r.due, m.now)}</span></li>`), "Aucun rappel dans les 14 prochains jours.")}
    ${watch("Stock à surveiller", "Produits", m.stock.length, m.stock.map((p) => `<li><span class="l"><b>${X.esc(p.name)}</b><small>Seuil ${M.num(p.min)} ${X.esc(p.unit)}</small></span><span class="r late">${M.num(p.qty)} ${X.esc(p.unit)}</span></li>`), "Aucun produit sous son seuil.")}
    ${activity()}
    ${cabinet()}
  </div>
</main>`;
</script>
</body>
</html>
